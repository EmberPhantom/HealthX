name: healthx
description: "A new Flutter project."
publish_to: 'none'

version: 1.7.0+7

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # ✅ Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.1.1
  firebase_messaging: ^15.1.3

  # ✅ Google Sign-in
  google_sign_in: ^6.2.1

  # ✅ Local Notifications — water reminders use Flutter, sleep/steps use native Kotlin
  flutter_local_notifications: ^18.0.1

  # ✅ FIX: timezone package REQUIRED for zonedSchedule() in flutter_local_notifications
  # Without this, zonedSchedule() throws MissingPluginException at runtime
  timezone: ^0.9.4

  # ✅ WebView — used for Help & Support (Tawk.to live chat)
  webview_flutter: ^4.10.0

  # Core packages
  cupertino_icons: ^1.0.6
  dio: ^5.8.0
  provider: ^6.1.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.2
  share_plus: ^11.0.0
  connectivity_plus: ^6.1.4
  path: ^1.9.1
  equatable: ^2.0.7
  collection: ^1.19.1
  async: ^2.13.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  http: ^1.4.0
  go_router: ^14.1.4
  geolocator: ^14.0.2
  flutter_map: ^8.2.1
  file_picker: ^10.2.0
  image: ^4.5.4
  flutter_svg: ^2.2.0
  google_fonts: ^6.1.0
  flex_color_scheme: ^8.2.0
  flutter_hooks: ^0.20.5
  loading_animation_widget: ^1.2.1
  flutter_staggered_grid_view: ^0.7.0
  animations: ^2.0.11
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.2
  fl_chart: ^0.71.0
  shimmer_animation: ^2.2.2
  responsive_framework: ^1.5.1
  table_calendar: ^3.2.0
  carousel_slider: ^5.1.1
  intl: ^0.20.2
  uuid: ^4.2.1
  vector_math: ^2.1.4
  http_parser: ^4.1.2
  crypto: ^3.0.6
  mime: ^2.0.0
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.13.1

