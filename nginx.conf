# HealthX Nginx Reverse Proxy Configuration Template
# This configuration should be adapted to your production server environment (e.g., /etc/nginx/sites-available/healthx)

# Define upstream for Express Backend
upstream backend_nodes {
    server 127.0.0.1:3000; # Address of the Node.js Express server
    keepalive 64;
}

# 1. HTTP Server - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.healthx.world; # Replace with your production domain name

    # Let's Encrypt / ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Reverse Proxy and Security Hardening
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.healthx.world; # Replace with your production domain name

    # SSL Certificates (Managed by certbot or similar CA)
    ssl_certificate /etc/letsencrypt/live/api.healthx.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.healthx.world/privkey.pem;

    # SSL Sessions and Timeout
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Modern/Secure SSL protocols and ciphers (Mozilla intermediate profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (HTTP Strict Transport Security) - Enforce HTTPS for 1 year (including subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # General Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self';" always;

    # Adjust file upload limits (matches 10mb body parser limit in Express)
    client_max_body_size 10M;

    # Root view / Static Assets fallback (if served by Nginx)
    location / {
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        
        # Headers for WebSockets and HTTP Keep-Alive connection
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Proxy standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Optimize static uploads directory serving (optional direct serve by Nginx)
    location /uploads/ {
        alias /var/www/healthx/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
